name: Release

# Tag-driven (M4-05). `git tag v0.2.0 && git push origin v0.2.0` is the whole
# trigger; workflow_dispatch exists so the pipeline can be *exercised* before
# any credential exists.
#
# Design rule for this file: every secret-dependent step must degrade to a
# visible warning rather than a failure when its secret is absent. Nothing here
# is enrolled yet (plan §8), so the first useful run of this workflow will be a
# manual dispatch that builds a universal, ad-hoc-signed DMG, skips notarization
# and skips publishing — proving the shape of the pipeline before $99 changes
# hands. As each secret is added, one more step switches itself on.
#
# Secrets, all optional, all checked by name below:
#   DEVELOPER_ID_P12            base64 of the .p12 export of the Developer ID
#                               Application certificate + private key
#   DEVELOPER_ID_P12_PASSWORD   the password used for that export
#   DEVELOPER_ID_NAME           "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_ID / NOTARY_ISSUER_ID / NOTARY_KEY_P8
#                               App Store Connect API key for notarytool
#   SPARKLE_PRIVATE_KEY         base64 of the 32-byte ed25519 seed
#   SPARKLE_PUBLIC_KEY          its public half, baked into Info.plist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Defaults to the VERSION file."
        required: false
        type: string
      publish:
        description: "Create the GitHub Release and push the appcast"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create releases, push gh-pages

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # CFBundleVersion is `git rev-list --count HEAD`

      # macos-15 runners ship Xcode, which is what makes the universal build
      # (`swift build --arch arm64 --arch x86_64`) possible at all — the dev
      # machine has Command Line Tools only (plan §8, ADR-001).
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building Filaway ${V}"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Test
        run: swift test

      # --- Signing identity ------------------------------------------------
      # Imported into a throwaway keychain that the last step deletes, so the
      # certificate never outlives the job and never touches the login keychain.
      - name: Import the Developer ID certificate
        id: identity
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "${P12}" ]; then
            echo "::warning title=No signing identity::DEVELOPER_ID_P12 is not set. Building ad-hoc signed; the DMG will not pass Gatekeeper."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/filaway-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "${P12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a UI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          if [ -z "${IDENTITY}" ]; then
            echo "::error title=Bad signing identity::DEVELOPER_ID_P12 imported but contains no Developer ID Application certificate."
            exit 1
          fi
          echo "Found: ${IDENTITY}"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "keychain=${KEYCHAIN}" >> "$GITHUB_OUTPUT"

      # --- Build -----------------------------------------------------------
      # FILAWAY_REQUIRE_UNIVERSAL=1 turns make_app.sh's "fall back to the native
      # arch" warning into a hard failure. On this runner a non-universal build
      # is a bug, and shipping one silently would make Sparkle stamp
      # sparkle:hardwareRequirements=arm64 on the appcast entry — Intel users
      # would simply never be offered the update.
      - name: Build the app (universal)
        env:
          FILAWAY_VERSION: ${{ steps.version.outputs.version }}
          FILAWAY_REQUIRE_UNIVERSAL: "1"
          DEVELOPER_ID: ${{ steps.identity.outputs.identity }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          if [ -z "${SPARKLE_PUBLIC_KEY}" ]; then
            echo "::warning title=No Sparkle key::SPARKLE_PUBLIC_KEY is not set. SUPublicEDKey will be omitted and this build cannot update itself."
          fi
          Tools/make_app.sh

      - name: Verify the universal binary
        run: |
          BIN=build/Filaway.app/Contents/MacOS/Filaway
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64
          lipo -info build/Filaway.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle
          otool -L "$BIN" | grep Sparkle
          codesign --verify --deep --strict --verbose=2 build/Filaway.app

      - name: UI smoke (plan §8)
        run: Tools/smoke.sh

      - name: Package the DMG
        env:
          FILAWAY_VERSION: ${{ steps.version.outputs.version }}
          FILAWAY_DMG_PLAIN: "1"   # create-dmg drives Finder; the runner has none
        run: Tools/make_dmg.sh

      # --- Notarize --------------------------------------------------------
      - name: Notarize and staple
        if: steps.identity.outputs.signed == 'true'
        env:
          FILAWAY_VERSION: ${{ steps.version.outputs.version }}
          DEVELOPER_ID: ${{ steps.identity.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -z "${NOTARY_KEY_ID}" ] || [ -z "${NOTARY_ISSUER_ID}" ] || [ -z "${NOTARY_KEY_P8}" ]; then
            echo "::warning title=Not notarized::NOTARY_KEY_ID / NOTARY_ISSUER_ID / NOTARY_KEY_P8 are not all set. The DMG is Developer ID signed but not notarized; Gatekeeper will still refuse it on a clean Mac."
            exit 0
          fi
          Tools/notarize.sh

      - name: Explain why notarization was skipped
        if: steps.identity.outputs.signed != 'true'
        run: echo "::warning title=Not notarized::No Developer ID certificate, so there is nothing to notarize."

      # --- Appcast ---------------------------------------------------------
      # Pulls the previous release's DMGs down first so generate_appcast can
      # build binary deltas against them; without that every update is a full
      # 66 MB download. Best-effort: a missing previous release is not an error.
      - name: Fetch recent releases for delta generation
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          # Guarded here rather than in `if:` — a step's own `env:` block is not
          # visible to its `if:` expression.
          if [ "${HAS_SPARKLE_KEY}" != "true" ]; then
            echo "No Sparkle key; skipping delta sources."
            exit 0
          fi
          mkdir -p build/releases
          for tag in $(gh release list --limit 3 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --dir build/releases --pattern '*.dmg' --clobber || true
            gh release download "$tag" --dir build/releases --pattern 'appcast.xml' --clobber || true
          done
          ls -la build/releases || true

      - name: Sign the update and generate the appcast
        id: appcast
        env:
          FILAWAY_VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::warning title=No appcast::SPARKLE_PRIVATE_KEY is not set, so the update cannot be signed and no appcast was generated. Run Tools/sparkle/generate_keys.sh --export and add the secret."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          Tools/sparkle/make_appcast.sh
          echo "generated=true" >> "$GITHUB_OUTPUT"
          cat build/releases/appcast.xml

      # --- Publish ---------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Filaway-${{ steps.version.outputs.version }}
          path: |
            build/Filaway-*.dmg
            build/releases/appcast.xml
          if-no-files-found: error

      - name: Create the GitHub Release
        id: publish
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          ASSETS="build/Filaway-${VERSION}.dmg"
          [ -f build/releases/appcast.xml ] && ASSETS="${ASSETS} build/releases/appcast.xml"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ${ASSETS} --clobber
          else
            gh release create "$TAG" --title "Filaway ${VERSION}" --generate-notes ${ASSETS}
          fi

      # GitHub Pages serves SUFeedURL. The appcast is a single file, so the
      # branch is written directly rather than through the Pages build action —
      # fewer moving parts, and it keeps working if Pages is configured by hand.
      - name: Publish the appcast to gh-pages
        if: (github.ref_type == 'tag' || inputs.publish) && steps.appcast.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
            git -C "$WORK" checkout --orphan gh-pages
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
          fi
          cp build/releases/appcast.xml "$WORK/appcast.xml"
          # Stops Jekyll from trying to build the branch and 404-ing the XML.
          touch "$WORK/.nojekyll"
          git -C "$WORK" add appcast.xml .nojekyll
          if git -C "$WORK" diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git -C "$WORK" commit -m "appcast: Filaway ${{ steps.version.outputs.version }}"
            git -C "$WORK" push origin gh-pages
          fi

      - name: Remove the signing keychain
        if: always() && steps.identity.outputs.keychain != ''
        run: security delete-keychain "${{ steps.identity.outputs.keychain }}" || true
