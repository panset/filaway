name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # macos-15 ships Xcode, so `swift build --arch arm64 --arch x86_64` works
      # here even though it cannot on the dev machine (plan §8, ADR-001).
      # Selecting it explicitly is what makes the universal check below real.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcode-select -p

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # The churn, scale (NFR-2) and live-FSEvents suites run here too — the
      # whole suite is a few seconds. Set FILAWAY_SKIP_SLOW_TESTS=1 to skip all
      # three, or FILAWAY_SKIP_FSEVENTS_TESTS=1 for just the timing-sensitive
      # stream test, if a loaded runner turns out to be flaky.
      - name: Test
        run: swift test

      # Ad-hoc signed only; Developer ID signing and notarization live in the
      # release workflow once credentials exist (docs/plan.md §8).
      #
      # FILAWAY_REQUIRE_UNIVERSAL=1 makes the fallback-to-native-arch path a
      # failure instead of a warning. This is the one place the universal build
      # can be regression-tested at all — and it matters beyond Intel support:
      # Sparkle reads the slices out of the archive and stamps
      # sparkle:hardwareRequirements on the appcast entry, so an accidentally
      # arm64-only release would silently stop offering updates to Intel Macs.
      - name: Assemble app bundle (universal)
        env:
          FILAWAY_REQUIRE_UNIVERSAL: "1"
        run: Tools/make_app.sh

      - name: Verify the universal binary and the embedded Sparkle
        run: |
          BIN=build/Filaway.app/Contents/MacOS/Filaway
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64
          # The rpath surgery in make_app.sh is easy to break and only shows up
          # at launch, so assert the link and the signature seal here.
          otool -L "$BIN" | grep -q 'Sparkle.framework'
          test -x build/Filaway.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate
          codesign --verify --deep --strict --verbose=2 build/Filaway.app

      # NFR-1's hard gate, as a command rather than only as a test: the bench
      # exits non-zero at p95 >= 100 ms.
      - name: Keyword perf gate (NFR-1)
        run: swift run filaway-bench keyword --notes 5000

      # The only UI verification available without Xcode (plan §8). Drives the
      # real AppModel / NoteStore / NSTextView in six phases and exits with the
      # failure count. Needs a window server; if the runner turns out not to
      # provide one, drop this step rather than weakening the phases.
      - name: UI smoke (plan §8)
        run: Tools/smoke.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Filaway.app
          path: build/Filaway.app
          if-no-files-found: error
