name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcode-select -p

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # The churn, scale (NFR-2) and live-FSEvents suites run here too — the
      # whole suite is a few seconds. Set FILAWAY_SKIP_SLOW_TESTS=1 to skip all
      # three, or FILAWAY_SKIP_FSEVENTS_TESTS=1 for just the timing-sensitive
      # stream test, if a loaded runner turns out to be flaky.
      - name: Test
        run: swift test

      # Ad-hoc signed only; Developer ID signing and notarization live in the
      # release workflow once credentials exist (docs/plan.md §8).
      - name: Assemble app bundle
        run: Tools/make_app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Filaway.app
          path: build/Filaway.app
          if-no-files-found: error
